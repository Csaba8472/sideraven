# SIDERAVEN-HOOK: Sideraven's issue form (Sideraven version and Sidebar mode; no links to Iceraven's issue rules)
name: "🐞 Bug report"
description: Create a report to help us improve.
title: "[Bug]: "
labels: ["🐞 bug", "needs:triage"]
body:
  - type: markdown
    attributes:
      value: |
        - Search the existing issues first, so a problem is only reported once.
        - One problem per issue, please.
        - If the problem also happens in Iceraven, it may be Iceraven's or Firefox's to fix: say so below.
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Have a tab open..
        2. Go to..
        3. Click on..
        4. Observe..
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      placeholder: A menu should open..
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour
      placeholder: The app closes unexpectedly..
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        # Device information
  - type: input
    attributes:
      label: Device name
      description: The name of the device model and manufacturer.
      placeholder: Google Pixel 2
    validations:
      required: false
  - type: input
    attributes:
      label: Android version
      description: You can find the Android version information in the About section of your device's system settings.
      placeholder: Android 10
    validations:
      required: true
  - type: input
    attributes:
      label: Sideraven version
      description: You can find this in Settings -> About Sideraven.
      placeholder: 1.0.0 arm64-v8a
    validations:
      required: true
  - type: input
    attributes:
      label: Sidebar mode and device
      description: Persistent, Collapsed or Auto-Hide; tablet or phone; Sidebar on the left or the right.
      placeholder: Auto-Hide, tablet, left
    validations:
      required: true
  - type: textarea
    attributes:
      label: Device logs
      description: |
        Device logs or crash information can greatly aid in debugging. You can find some details here on how to [retrieve device logs or crash IDs][log].

        [log]: https://github.com/Dweep4269/sideraven/blob/main/docs/Logging-Crash-Information.md
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional information
      description: |
        If you have any additional information for us, use the field below.
        Please note, you can attach screenshots or screen recordings here, by
        dragging and dropping files in the field below.
    validations:
      required: false
